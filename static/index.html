<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NETGUARD IoT — Botnet Detection & Cybersecurity Dashboard</title>
  <meta name="description" content="Advanced IoT botnet detection and network monitoring system featuring rule-based heuristics and machine-learning anomaly classification.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">

  <!-- Core Cybersecurity Stylesheets -->
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="app-shell">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <polyline points="9 12 11 14 15 10"/>
          </svg>
        </div>
        <div class="logo-text">
          <h1>NETGUARD IoT</h1>
          <span>Defense System</span>
        </div>
        <button id="sidebar-collapse-btn" class="close-btn" style="margin-left: auto; font-size: 16px;" title="Toggle Sidebar">
          ❮
        </button>
      </div>

      <!-- Nav Items -->
      <nav class="nav-group">
        <div class="nav-label">Monitoring Center</div>

        <button class="nav-item active" data-view="overview" id="nav-overview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>Overview</span>
        </button>

        <button class="nav-item" data-view="traffic" id="nav-traffic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          <span>Live Traffic</span>
        </button>

        <button class="nav-item" data-view="devices" id="nav-devices">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
          <span>IoT Devices</span>
        </button>

        <div class="nav-label">Detection Engines</div>

        <button class="nav-item" data-view="threats" id="nav-threats">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="12 2 2 22 22 22 12 2"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <span>Threat Detection</span>
        </button>

        <button class="nav-item" data-view="ml" id="nav-ml">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg>
          <span>ML Analysis</span>
        </button>

        <button class="nav-item" data-view="alerts" id="nav-alerts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span>Security Alerts</span>
          <span class="nav-badge" id="nav-alerts-badge">3</span>
        </button>

        <div class="nav-label">Intelligence</div>

        <button class="nav-item" data-view="analytics" id="nav-analytics">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <span>Analytics & Reports</span>
        </button>

        <button class="nav-item" data-view="settings" id="nav-settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Settings</span>
        </button>
      </nav>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <div class="engine-status-pill">
          <div style="display: flex; align-items: center;">
            <span class="pulse-indicator"></span>
            <span style="font-weight: 600; color: var(--text-main);">SecOps Sentinel</span>
          </div>
          <span style="font-family: var(--font-mono); font-size: 11px; color: var(--highlight-mint);">v2.4</span>
        </div>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <!-- Top App Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <button id="mobile-menu-btn" class="close-btn" style="display: none; font-size: 20px;">☰</button>
          <div class="breadcrumbs">
            <span style="color: var(--text-muted);">NETGUARD</span>
            <span style="color: var(--text-muted);">/</span>
            <span class="current" id="topbar-breadcrumb-view">Overview Dashboard</span>
          </div>
        </div>

        <div class="topbar-right">
          <!-- Global Search -->
          <div style="position: relative;">
            <input type="text" id="global-search-input" placeholder="Search devices, IPs, threats... (Enter)"
                   style="background: var(--bg-card); border: 1px solid var(--border-subtle); color: var(--text-main); font-size: 12px; padding: 6px 12px 6px 30px; border-radius: var(--radius-md); width: 250px;" />
            <svg style="position: absolute; left: 9px; top: 8px; width: 14px; height: 14px; color: var(--text-muted);" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </div>

          <!-- Demo Mode Indicator -->
          <div id="topbar-demo-indicator" class="demo-mode-pill" title="System is streaming synthetic demonstration IoT telemetry flows">
            <span class="pulse-indicator alert" style="width: 6px; height: 6px; margin-right: 4px;"></span>
            <span>DEMO SIMULATION</span>
          </div>

          <!-- Monitoring Status Badge -->
          <div id="topbar-status-indicator" class="ip-chip" style="color: var(--highlight-mint); display: flex; align-items: center; gap: 6px;">
            <span class="pulse-indicator"></span>
            <span>Live Stream</span>
          </div>

          <!-- Notification Bell -->
          <div style="position: relative;">
            <button id="notification-bell-btn" class="btn btn-secondary btn-sm" style="padding: 6px 10px; position: relative;" title="Security Alerts Center">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              <span id="notif-badge-count" style="position: absolute; top: -4px; right: -4px; background: var(--state-danger); color: #fff; font-size: 10px; font-weight: 700; border-radius: 999px; padding: 1px 5px; font-family: var(--font-mono);">3</span>
            </button>

            <!-- Notifications Dropdown -->
            <div id="notification-dropdown" style="display: none; position: absolute; right: 0; top: 38px; width: 320px; background: var(--bg-card); border: 1px solid var(--border-medium); border-radius: var(--radius-md); box-shadow: var(--shadow-md); z-index: 50;">
              <!-- Rendered via JS -->
            </div>
          </div>

          <!-- Interactive User Profile Menu -->
          <div style="position: relative;">
            <button id="user-profile-btn" class="btn btn-secondary btn-sm" style="display: flex; align-items: center; gap: 8px; padding: 4px 10px;">
              <div style="width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg, var(--primary-accent), var(--bg-card)); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #fff;">
                AV
              </div>
              <span style="font-size: 12px; font-weight: 600; color: var(--text-main);">Alex Vance</span>
              <span style="font-size: 10px; color: var(--text-muted);">▾</span>
            </button>

            <div id="user-profile-dropdown" style="display: none;">
              <div class="profile-dropdown-header">
                <div style="font-weight: 700; color: var(--text-main); font-size: 13px;">Alex Vance</div>
                <div style="font-size: 11px; color: var(--highlight-mint); font-family: var(--font-mono);">SecOps Lead · Admin</div>
              </div>
              <div class="profile-menu-item" onclick="App.navigateTo('settings'); document.getElementById('user-profile-dropdown').style.display='none';">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                <span>Engine Preferences</span>
              </div>
              <div class="profile-menu-item" onclick="App.showToast('Quarantine Authority Verified (Tier 3)', 'success'); document.getElementById('user-profile-dropdown').style.display='none';">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <span>Quarantine Privileges (Active)</span>
              </div>
              <div class="profile-menu-item" onclick="App.showToast('Gateway Session: SEC-GW-8080 (Operational)', 'info'); document.getElementById('user-profile-dropdown').style.display='none';">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                <span>Gateway Session Info</span>
              </div>
            </div>
          </div>
        </div>
      </header>

      <!-- View Containers -->
      <main>
        <section id="view-overview" class="view-container active"></section>
        <section id="view-traffic" class="view-container"></section>
        <section id="view-devices" class="view-container"></section>
        <section id="view-threats" class="view-container"></section>
        <section id="view-ml" class="view-container"></section>
        <section id="view-alerts" class="view-container"></section>
        <section id="view-analytics" class="view-container"></section>
        <section id="view-settings" class="view-container"></section>
      </main>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Scripts: API Client, Data, Views, and Application Core -->
  <script src="js/data/fallback_data.js?v=5"></script>
  <script src="js/api/client.js?v=8"></script>
  <script src="js/views/overview.js?v=5"></script>
  <script src="js/views/traffic.js?v=5"></script>
  <script src="js/views/devices.js?v=5"></script>
  <script src="js/views/threats.js?v=5"></script>
  <script src="js/views/ml_module.js?v=5"></script>
  <script src="js/views/alerts.js?v=5"></script>
  <script src="js/views/analytics.js?v=5"></script>
  <script src="js/views/settings.js?v=5"></script>
  <script src="js/app.js?v=5"></script>
</body>
</html>
